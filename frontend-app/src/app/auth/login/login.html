<div class="h-screen w-screen overflow-hidden relative flex items-center justify-center lg:justify-end lg:pr-[7%] xl:pr-[9%] bg-[#fafaf9] font-sans">
  
  <img 
    src="/fes-bg.png" 
    alt="Fès Smart City Background" 
    class="hidden lg:block absolute inset-0 w-full h-full object-cover object-left-bottom pointer-events-none select-none z-0"
  />

  <div class="relative z-10 w-full max-w-[400px] mx-4 lg:mx-0 bg-[#fdfbf7]/95 backdrop-blur-sm rounded-3xl shadow-2xl border border-white p-7 sm:p-8 animate-slide-top">
    
    <div class="text-center mb-6">
      <div class="inline-flex flex-col items-center justify-center">
        <img 
          src="/logo.png" 
          alt="Mdinty Logo Officiel" 
          class="w-36 h-auto object-contain mx-auto mix-blend-multiply"
        />
        <p class="text-xs font-semibold uppercase tracking-widest text-accent mt-1">
          Fès Smart City
        </p>
      </div>
    </div>

    <div *ngIf="errorMessage" class="mb-4 p-2.5 rounded-xl bg-red-50 border border-red-200 text-alert text-xs flex items-center gap-2">
      <span>⚠️</span>
      <span>{{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-3.5">
      
      <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </span>
        <input 
          type="email" 
          name="email"
          [(ngModel)]="email"
          placeholder="Username"
          required
          class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brand focus:ring-2 focus:ring-sky-100 transition-all"
        />
      </div>

      <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </span>
        <input 
          [type]="showPassword ? 'text' : 'password'" 
          name="password"
          [(ngModel)]="password"
          placeholder="Password"
          required
          class="w-full pl-11 pr-11 py-3 bg-white border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brand focus:ring-2 focus:ring-sky-100 transition-all"
        />
        <button 
          type="button" 
          (click)="togglePassword()"
          class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-brand"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
        </button>
      </div>

      <div class="pt-1">
        <button 
          type="submit" 
          [disabled]="isLoading"
          class="w-full py-3 px-4 bg-[#094769] hover:bg-brand-dark active:scale-[0.99] text-white font-heading text-sm font-semibold rounded-full shadow-md hover:shadow-lg transition-all flex items-center justify-center disabled:opacity-60"
        >
          <span *ngIf="!isLoading">Se connecter</span>
          <span *ngIf="isLoading">Connexion en cours...</span>
        </button>
      </div>

      <div class="flex items-center justify-between text-xs py-1">
        <label class="flex items-center gap-2 text-slate-700 cursor-pointer">
          <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe" class="rounded border-slate-300 text-brand focus:ring-brand"/>
          <span>Se souvenir de moi</span>
        </label>
        <a href="#" class="font-medium text-brand hover:underline transition-colors">
          Mot de passe oublié ?
        </a>
      </div>

      <button 
        type="button"
        routerLink="/register"
        class="w-full py-3 px-4 bg-[#df9c26] hover:bg-[#c58b2b] active:scale-[0.99] text-white font-heading text-sm font-semibold rounded-full shadow-sm hover:shadow transition-all"
      >
        S'inscrire
      </button>

    </form>
  </div>
</div>
