services:
  # Stockage des Photos d'Incidents (Compatible S3)
  mdinty-storage:
    image: pgsty/minio:latest
    container_name: mdinty_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - mdinty_miniodata:/data
    restart: unless-stopped

volumes:
  mdinty_miniodata: